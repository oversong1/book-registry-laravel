; OPcache: guarda o PHP ja compilado na memoria, em vez de reler e recompilar
; os arquivos a cada pagina (o que e lento com o projeto numa pasta do Windows).
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
; Confere se um arquivo mudou no maximo a cada 2 segundos (voce edita e ve a mudanca logo)
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Cache dos caminhos de arquivo: evita perguntar ao Windows onde cada arquivo esta
realpath_cache_size=4096K
realpath_cache_ttl=600
